<!-- Contact Section -->
  {% extends "user_details/index.html" %}
 {% block content %}

<section class="contact" id="contact">

    <h2 class="section-title">Contact <span>Me</span></h2>

    <div class="contact-container">

        <form>

            <input
                type="text"
                placeholder="Your Name"
                required
            >

            <input
                type="email"
                placeholder="Your Email"
                required
            >

            <textarea
                placeholder="Your Message"
                required
            ></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

    </div>

</section>
 {% endblock content %}
